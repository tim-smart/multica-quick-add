name: MulticaQuickAdd

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  MulticaQuickAdd:
    type: application
    platform: macOS
    sources:
      - path: MulticaQuickAdd
    entitlements:
      path: MulticaQuickAdd/MulticaQuickAdd.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.multica.quickadd
        PRODUCT_MODULE_NAME: MulticaQuickAdd
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Multica Quick Add
        INFOPLIST_KEY_CFBundleName: Multica Quick Add
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_STRICT_CONCURRENCY: complete

  MulticaQuickAddTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MulticaQuickAddTests
    dependencies:
      - target: MulticaQuickAdd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  MulticaQuickAdd:
    build:
      targets:
        MulticaQuickAdd: all
    test:
      targets:
        - MulticaQuickAddTests
